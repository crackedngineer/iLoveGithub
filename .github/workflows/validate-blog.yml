name: Validate Blog Content

on:
  push:
    branches: [master]
    paths:
      - "blog/posts/**"
  pull_request:
    paths:
      - "blog/posts/**"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      warnings: ${{ steps.validate.outputs.warnings }}
      errors: ${{ steps.validate.outputs.errors }}
      total: ${{ steps.validate.outputs.total }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml langchain-openai langchain-core pydantic

      - name: Collect blog files
        id: collect
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.base_ref }} --depth=1
            git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'blog/posts/*.md' \
              > /tmp/blog_files.txt
          else
            find blog/posts -maxdepth 1 -name '*.md' > /tmp/blog_files.txt
          fi

          if [ -s /tmp/blog_files.txt ]; then
            echo "has_files=true" >> "$GITHUB_OUTPUT"
            echo "Validating $(wc -l < /tmp/blog_files.txt) file(s):"
            cat /tmp/blog_files.txt
          else
            echo "has_files=false" >> "$GITHUB_OUTPUT"
            echo "No blog files to validate."
          fi

      - name: Validate blog content
        id: validate
        if: steps.collect.outputs.has_files == 'true'
        run: python scripts/validate_blog_content.py /tmp/blog_files.txt
        env:
          API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BASE_URL: ${{ secrets.OPENROUTER_BASE_URL }}

      - name: Upload SARIF to GitHub Security
        if: always() && steps.collect.outputs.has_files == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bloglint.sarif
          category: blog-lint

      - name: Upload lint reports
        if: always() && steps.collect.outputs.has_files == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bloglint-report
          path: |
            bloglint.json
            bloglint.sarif
          retention-days: 14

      - name: Summary — no files changed
        if: steps.collect.outputs.has_files == 'false'
        run: echo "No blog posts were changed — skipping validation." >> "$GITHUB_STEP_SUMMARY"
